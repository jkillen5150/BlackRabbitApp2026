<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lawn Care Portfolio | Yelm &amp; Thurston County | Black Rabbit</title>
  <meta name="description" content="See Black Rabbit Landscaping job photos — mowing, edges, and curb appeal in Yelm, Rainier, Lacey, Roy &amp; Olympia WA.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://blackrabbitlawn.com/portfolio">
  <link rel="icon" href="logo.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="logo.jpg">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="en_US">
  <meta property="og:site_name" content="Black Rabbit Landscaping">
  <meta property="og:title" content="Lawn Care Portfolio | Black Rabbit Landscaping">
  <meta property="og:description" content="Before &amp; after lawn care and landscaping across Thurston County WA.">
  <meta property="og:url" content="https://blackrabbitlawn.com/portfolio">
  <meta property="og:image" content="https://blackrabbitlawn.com/logo.jpg">
  <meta property="og:image:alt" content="Black Rabbit Landscaping logo">
  <meta name="twitter:card" content="summary">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body data-page="portfolio">
  <div id="site-nav-mount"></div>

  <header class="page-hero">
    <h1>Lawn Care Portfolio — South Sound</h1>
    <p>Fresh cuts, clean edges, and curb-appeal jobs across Yelm, Rainier, Lacey, Roy &amp; Olympia.</p>
  </header>

  <section class="section">
    <div class="portfolio-grid" id="portfolio-grid"></div>
  </section>

  <footer class="site-footer">
    <p><a href="index.html">← Home</a> · Admin can upload photos via <a href="login.html?role=admin">Login</a></p>
  </footer>

  <script src="js/content-store.js"></script>
  <script src="js/site-common.js"></script>
  <script>
    async function render() {
      const data = await BRContent.load();
      const grid = document.getElementById('portfolio-grid');
      const list = data.portfolio || [];
      if (!list.length) {
        grid.innerHTML = '<div class="empty-state">No portfolio photos yet. Upload them in Admin.</div>';
        return;
      }
      grid.innerHTML = list.map((p) => `
        <article class="portfolio-card">
          <img src="${BRContent.escapeAttr(p.image)}" alt="${BRContent.escapeAttr(p.title || 'Job photo')}" loading="lazy">
          <div class="body">
            <h3>${BRContent.escapeHtml(p.title || 'Project')}</h3>
            <div class="loc">${BRContent.escapeHtml(p.location || '')}${p.date ? ' · ' + BRContent.escapeHtml(BRContent.formatDate(p.date)) : ''}</div>
            <p>${BRContent.escapeHtml(p.description || '')}</p>
          </div>
        </article>
      `).join('');
    }
    document.addEventListener('DOMContentLoaded', render);
    window.addEventListener('br:content-updated', render);
  </script>
</body>
</html>
