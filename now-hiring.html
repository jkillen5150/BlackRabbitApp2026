<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Now Hiring — Door Knockers | Black Rabbit Landscaping</title>
  <meta name="description" content="Want free time, your own schedule, and commission-only compensation? Black Rabbit hiring door knockers. Text APPLY to (407) 951-1663 — applicants only.">
  <link rel="canonical" href="https://blackrabbitlawn.com/now-hiring">
  <link rel="icon" href="logo.jpg" type="image/jpeg">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/hiring-extras.css">
</head>
<body data-page="now-hiring">
  <noscript><p style="padding:2rem;font-family:sans-serif">Enable JavaScript for the form, or text <strong>APPLY</strong> to (407) 951-1663 (applicants only — do not solicit).</p></noscript>
  <p id="nh-boot" style="font-family:Montserrat,sans-serif;padding:2rem;text-align:center">Loading application…</p>
  <script>
  (async function () {
    try {
      const parts = await Promise.all([
        fetch('/nh.b64.0', {cache:'no-store'}).then(r => r.text()),
        fetch('/nh.b64.1', {cache:'no-store'}).then(r => r.text())
      ]);
      const bin = Uint8Array.from(atob(parts.join('').trim()), c => c.charCodeAt(0));
      const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
      const text = await new Response(stream).text();
      document.open();
      document.write(text);
      document.close();
    } catch (e) {
      document.getElementById('nh-boot').innerHTML = 'Please text <strong>APPLY</strong> to <a href="sms:+14079511663?body=APPLY">(407) 951-1663</a> (applicants only — no solicitations).';
    }
  })();
  </script>
</body>
</html>
